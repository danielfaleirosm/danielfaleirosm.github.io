<meta property="og:description" content="Seminário de Funções Orgânicas, Grupo 1: onde a hidroxila aparece no dia a dia. 12 compostos reais, com a estrutura química e o grupo funcional em destaque.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0; font:14px system-ui, sans-serif; background:#fafafa}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Álcool, Fenol e Enol</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  color-scheme: light;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter Tight",system-ui,"Helvetica Neue",Arial,sans-serif;
  --f-serif:ui-serif,"New York",Charter,"Iowan Old Style",Georgia,serif;
  --f-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;

  --ink:#0E1419; --ink-2:#4A5560; --ink-3:#7E8995;
  --ground:#EBEFF4; --ground-deep:#DDE3EB;
  --glass:rgba(255,255,255,.62);
  --glass-soft:rgba(255,255,255,.42);
  --glass-hi:rgba(255,255,255,.78);
  --edge:rgba(14,20,25,.11);
  --edge-soft:rgba(14,20,25,.07);
  --plate:rgba(255,255,255,.66);
  --shadow:0 1px 2px rgba(14,20,25,.05),0 14px 34px -12px rgba(14,20,25,.22);
  --shadow-lift:0 2px 6px rgba(14,20,25,.07),0 28px 60px -18px rgba(14,20,25,.30);

  /* hues das funções — mesmas do artigo e das estruturas */
  --alc:#1B998B; --fen:#E09F3E; --eno:#6C4AB6;
  --alc-t:#0C7D70; --fen-t:#9E6612; --eno-t:#5A3AA4;
  --hl-alc:#1B998B; --hl-fen:#E09F3E; --hl-eno:#6C4AB6;
  --mol-ink:#1B242C; --mol-o:#C0392B; --mol-n:#2B5CC4;
  --mol-neutral:#9AA5B1;

  --accent:#5A6472; --accent-t:#3D4652;
  --ok:#1B998B; --no:#C8102E;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ink:#F1F5F9; --ink-2:#A6B2BF; --ink-3:#727E8B;
    --ground:#090B0F; --ground-deep:#04060A;
    --glass:rgba(255,255,255,.065);
    --glass-soft:rgba(255,255,255,.04);
    --glass-hi:rgba(255,255,255,.13);
    --edge:rgba(255,255,255,.11);
    --edge-soft:rgba(255,255,255,.06);
    --plate:rgba(255,255,255,.045);
    --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px -12px rgba(0,0,0,.65);
    --shadow-lift:0 2px 6px rgba(0,0,0,.5),0 28px 60px -18px rgba(0,0,0,.75);
    --alc-t:#3FCBB8; --fen-t:#F2BC6A; --eno-t:#AD90F2;
    --hl-alc:#1FAE9E; --hl-fen:#E09F3E; --hl-eno:#8867D8;
    --mol-ink:#E6EDF4; --mol-o:#FF8B7E; --mol-n:#8FB4FF;
    --mol-neutral:#6C7783;
    --accent:#8A95A3; --accent-t:#AFBAC7;
    --ok:#3FCBB8; --no:#FF6B6B;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ink:#F1F5F9; --ink-2:#A6B2BF; --ink-3:#727E8B;
  --ground:#090B0F; --ground-deep:#04060A;
  --glass:rgba(255,255,255,.065);
  --glass-soft:rgba(255,255,255,.04);
  --glass-hi:rgba(255,255,255,.13);
  --edge:rgba(255,255,255,.11);
  --edge-soft:rgba(255,255,255,.06);
  --plate:rgba(255,255,255,.045);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px -12px rgba(0,0,0,.65);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5),0 28px 60px -18px rgba(0,0,0,.75);
  --alc-t:#3FCBB8; --fen-t:#F2BC6A; --eno-t:#AD90F2;
  --hl-alc:#1FAE9E; --hl-fen:#E09F3E; --hl-eno:#8867D8;
  --mol-ink:#E6EDF4; --mol-o:#FF8B7E; --mol-n:#8FB4FF;
  --mol-neutral:#6C7783;
  --accent:#8A95A3; --accent-t:#AFBAC7;
  --ok:#3FCBB8; --no:#FF6B6B;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--f-ui); font-size:clamp(14px,min(1.35vw,2.4vh),60px); line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  letter-spacing:-.011em;
}
h1,h2,h3,p,ul,ol,figure{margin:0}
ul{padding:0; list-style:none}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
:focus-visible{outline:2px solid var(--accent-t); outline-offset:3px; border-radius:8px}

/* ---------- ambiente (liquid glass precisa de algo por baixo) ---------- */
#amb{position:fixed; inset:-18%; z-index:0; pointer-events:none;
  background:
    radial-gradient(38% 46% at 18% 24%, color-mix(in oklab,var(--accent) 34%, transparent), transparent 70%),
    radial-gradient(34% 40% at 82% 18%, color-mix(in oklab,var(--accent) 20%, transparent), transparent 70%),
    radial-gradient(46% 52% at 68% 88%, color-mix(in oklab,var(--accent) 26%, transparent), transparent 72%),
    radial-gradient(40% 44% at 8% 86%, color-mix(in oklab,var(--accent) 14%, transparent), transparent 70%);
  transition:background 1.1s cubic-bezier(.32,.72,0,1);
  animation:drift 34s ease-in-out infinite alternate;
  will-change:transform;
}
#amb::after{content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, transparent 30%, var(--ground-deep) 140%); opacity:.5}
@keyframes drift{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(1.8%,-1.4%,0) scale(1.05)}
  100%{transform:translate3d(-1.6%,1.8%,0) scale(1.02)}
}

/* ---------- vidro ---------- */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(1.7);
  backdrop-filter:blur(26px) saturate(1.7);
  border:1px solid var(--edge);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
}
@supports not (backdrop-filter:blur(2px)){
  .glass{background:color-mix(in oklab,var(--ground) 82%, white)}
  :root[data-theme="dark"] .glass{background:color-mix(in oklab,var(--ground) 82%, white 8%)}
}

/* ---------- palco ---------- */
#stage{position:fixed; inset:0; z-index:1; overflow:hidden}
/* o slide não rola: o conteúdo cabe. Só telas pequenas liberam a rolagem. */
.slide{
  position:absolute; inset:0; overflow:hidden; overscroll-behavior:contain;
  padding:clamp(20px,3.4vh,132px) clamp(16px,min(3.6vw,6.4vh),192px) clamp(78px,11vh,348px);
  opacity:0; pointer-events:none; visibility:hidden;
  transform:translate3d(var(--dx,0),0,0) scale(.99);
  transition:opacity .42s cubic-bezier(.32,.72,0,1), transform .52s cubic-bezier(.32,.72,0,1), visibility 0s .52s;
}
.slide.on{opacity:1; pointer-events:auto; visibility:visible; transform:none; transition-delay:0s,0s,0s}
.wrap{max-width:min(4500px,177vh); margin:0 auto; min-height:100%; display:flex; flex-direction:column; gap:clamp(14px,2.2vh,84px)}

/* cabeçalho de slide */
.shead{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.shead h2{font-size:clamp(23px,min(3.1vw,5.51vh),126px); font-weight:640; letter-spacing:-.028em; text-wrap:balance; line-height:1.08}
.oh{
  width:clamp(30px,min(2.6vw,4.62vh),120px); height:clamp(30px,min(2.6vw,4.62vh),120px); border-radius:50%;
  display:grid; place-items:center; flex:none; background:var(--accent);
  color:#fff; font-size:clamp(10px,min(.86vw,1.53vh),36px); font-weight:700; letter-spacing:.02em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 4px 12px -4px var(--accent);
}
.eyebrow{font-size:clamp(10px,min(.8vw,1.42vh),36px); font-weight:620; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}

/* builds (revelação progressiva) */
.step{opacity:.2; filter:blur(.4px); transform:translateY(5px);
  transition:opacity .45s cubic-bezier(.32,.72,0,1), transform .45s cubic-bezier(.32,.72,0,1), filter .45s}
.step.shown{opacity:1; filter:none; transform:none}

/* ---------- moléculas ---------- */
.mol{display:block; width:100%}
.mol svg{display:block; width:100%; height:100%; overflow:visible}
.plate{
  background:var(--plate); border:1px solid var(--edge-soft); border-radius:18px;
  padding:clamp(8px,min(1.2vw,2.13vh),48px); display:grid; place-items:center;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}

/* ---------- capa ---------- */
.cover{flex:1; display:flex; flex-direction:column; justify-content:center; gap:clamp(18px,3vh,120px)}
.cover h1{
  font-size:clamp(38px,min(7.4vw,13.16vh),312px); font-weight:680; letter-spacing:-.042em; line-height:.96;
  text-wrap:balance;
}
.cover h1 em{font-style:normal; color:var(--accent-t)}
.cover .lede{font-family:var(--f-serif); font-size:clamp(17px,min(2.1vw,3.73vh),90px); color:var(--ink-2); max-width:24ch; line-height:1.32}
.trio{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(10px,min(1.4vw,2.49vh),66px); max-width:820px}
.trio .cell{border-radius:20px; padding:clamp(10px,min(1.2vw,2.13vh),48px); text-align:center}
.trio .mol{max-width:min(11vw,19.6vh,450px); margin:0 auto}
.trio .nm{margin-top:6px; font-weight:620; font-size:clamp(12px,min(1.15vw,2.04vh),51px); letter-spacing:-.01em}
.credits{display:flex; gap:10px 26px; flex-wrap:wrap; align-items:baseline; color:var(--ink-3); font-size:clamp(11px,min(.95vw,1.69vh),42px)}
.credits b{color:var(--ink-2); font-weight:560}

/* ---------- tese ---------- */
.tese{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(10px,min(1.5vw,2.67vh),66px); flex:1; align-content:center}
.fcard{border-radius:24px; padding:clamp(14px,min(1.7vw,3.02vh),78px); display:flex; flex-direction:column; gap:10px; text-align:center;
  transition:transform .4s cubic-bezier(.32,.72,0,1), box-shadow .4s}
.fcard .mol{max-width:min(18.3vw,32.5vh,750px); margin:0 auto}
.fcard h3{font-size:clamp(18px,min(2.1vw,3.73vh),90px); font-weight:640; letter-spacing:-.024em}
.fcard .bond{font-family:var(--f-mono); font-size:clamp(14px,min(1.5vw,2.67vh),66px); font-weight:600; letter-spacing:-.01em}
.fcard .cx{color:var(--ink-2); font-size:clamp(12px,min(1.05vw,1.87vh),48px); line-height:1.35; text-wrap:balance}
.fcard:hover{transform:translateY(-4px); box-shadow:var(--shadow-lift), inset 0 1px 0 var(--glass-hi)}

/* ---------- régua de pKa (dot plot: uma linha por substância) ---------- */
.ruler{border-radius:24px; padding:clamp(18px,min(2.4vw,4.27vh),102px); margin:auto 0;
  display:flex; flex-direction:column; gap:clamp(14px,2.4vh,78px)}
.dots{display:grid; grid-template-columns:minmax(62px,142px) minmax(0,1fr) auto minmax(0,auto);
  gap:clamp(9px,1.5vh,48px) clamp(10px,min(1.5vw,2.67vh),66px); align-items:center}
.dn{font-weight:600; font-size:clamp(12px,min(1.12vw,1.99vh),51px); color:var(--c,var(--ink)); letter-spacing:-.015em}
.dt{position:relative; height:20px;
  /* grade fina em pKa 4, 8, 12 e 16 */
  background-image:linear-gradient(90deg,var(--edge) 0 1px,transparent 1px);
  background-size:26.667% 100%; background-position-x:6.667%; background-repeat:repeat-x}
.dt::before{content:""; position:absolute; left:0; right:0; top:50%; height:2px; transform:translateY(-50%); border-radius:99px;
  background:linear-gradient(90deg,color-mix(in oklab,var(--no) 34%,transparent),color-mix(in oklab,var(--ink-3) 26%,transparent))}
.dt i{position:absolute; top:50%; left:var(--x); width:clamp(13px,min(1.1vw,1.96vh),44px); height:clamp(13px,min(1.1vw,1.96vh),44px); translate:-50% -50%; border-radius:50%;
  background:var(--c,var(--ink-3)); box-shadow:0 0 0 4px color-mix(in oklab,var(--c,var(--ink-3)) 18%, transparent)}
.dv{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-weight:600; color:var(--c,var(--ink));
  font-size:clamp(12.5px,min(1.25vw,2.22vh),57px); text-align:right; min-width:4.2ch}
.ds{font-size:clamp(10.5px,min(.92vw,1.64vh),40px); color:var(--ink-3); line-height:1.25}
.axis{position:relative; height:1.5em; font-family:var(--f-mono); font-variant-numeric:tabular-nums;
  font-size:clamp(10px,min(.84vw,1.49vh),38px); color:var(--ink-3)}
.axis span{position:absolute; top:0; transform:translateX(-50%)}
.note{font-size:clamp(11px,min(.95vw,1.69vh),42px); color:var(--ink-3); line-height:1.45}

/* ---------- conceito ---------- */
.concept{display:grid; grid-template-columns:minmax(190px,.72fr) 1.6fr; gap:clamp(16px,min(3vw,5.33vh),156px); flex:1; align-items:center}
.spec{border-radius:24px; padding:clamp(14px,min(1.6vw,2.84vh),72px); display:flex; flex-direction:column; gap:10px; text-align:center}
.spec .mol{max-width:min(22vw,39.1vh,900px); margin:0 auto}
.spec .bond{font-family:var(--f-mono); font-size:clamp(19px,min(2.4vw,4.27vh),102px); font-weight:600; color:var(--accent-t); letter-spacing:-.02em}
.spec .cap{font-size:clamp(11px,min(.95vw,1.69vh),42px); color:var(--ink-3); line-height:1.35; text-wrap:balance}
.col{display:flex; flex-direction:column; gap:clamp(12px,2.2vh,72px)}
.deff{font-family:var(--f-serif); font-size:clamp(16px,min(1.7vw,3.02vh),78px); line-height:1.38; letter-spacing:-.006em;
  max-width:64ch; text-wrap:pretty}
.deff sub,.deff sup{font-family:var(--f-serif)}
.kicker{font-size:clamp(10px,min(.8vw,1.42vh),36px); font-weight:620; letter-spacing:.13em; text-transform:uppercase; color:var(--accent-t)}

/* linhas curtas que abrem o texto completo do content.js */
.rows{display:flex; flex-direction:column; gap:6px}
.xrow{border-radius:14px; border:1px solid var(--edge-soft); background:var(--plate); overflow:hidden}
.xrow > button{width:100%; display:flex; align-items:center; gap:12px; padding:.6em .9em; text-align:left;
  font-size:clamp(12.5px,min(1.2vw,2.13vh),54px); font-weight:560; letter-spacing:-.014em; line-height:1.3}
.xrow > button .pl{margin-left:auto; flex:none; color:var(--ink-3); font-size:1.15em; line-height:1;
  transition:transform .32s cubic-bezier(.32,.72,0,1)}
.xrow.open > button .pl{transform:rotate(45deg)}
.xrow > button b{color:var(--accent-t)}
.xrow .full{display:grid; grid-template-rows:0fr; transition:grid-template-rows .36s cubic-bezier(.32,.72,0,1)}
.xrow.open .full{grid-template-rows:1fr}
.xrow .full > div{overflow:hidden}
.xrow .full p{padding:0 .95em .8em; font-size:clamp(11.5px,min(1.02vw,1.81vh),46px); line-height:1.48; color:var(--ink-2)}
.ex{font-family:var(--f-mono); font-size:clamp(11px,min(1vw,1.78vh),45px); color:var(--accent-t); line-height:1.5}

/* ---------- compostos ---------- */
.grid4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:clamp(10px,min(1.3vw,2.31vh),60px); flex:1; align-content:center}
.cmp{border-radius:22px; padding:clamp(11px,min(1.15vw,2.04vh),54px); display:flex; flex-direction:column; gap:10px; text-align:left;
  transition:transform .4s cubic-bezier(.32,.72,0,1), box-shadow .4s; position:relative; overflow:hidden}
.cmp:hover,.cmp:focus-visible{transform:translateY(-5px); box-shadow:var(--shadow-lift), inset 0 1px 0 var(--glass-hi)}
.cmp .sheen{position:absolute; inset:-40%; opacity:0; pointer-events:none; transition:opacity .35s;
  background:radial-gradient(28% 34% at var(--mx,50%) var(--my,0%), var(--glass-hi), transparent 70%)}
.cmp:hover .sheen{opacity:.85}
/* prato deitado como as estruturas, para não sobrar vazio dentro do card */
.cmp .plate{flex:none; width:100%; aspect-ratio:4/3; padding:clamp(5px,min(.8vw,1.42vh),33px)}
.cmp .mol,.cmp .mol svg{width:100%; height:100%}
.cmp h3{font-size:clamp(13.5px,min(1.25vw,2.22vh),57px); font-weight:640; letter-spacing:-.018em; line-height:1.18; text-wrap:balance}
.cmp .iupac{font-family:var(--f-mono); font-size:clamp(9.5px,min(.78vw,1.39vh),34px); color:var(--ink-3); line-height:1.3; word-break:break-word}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.tag{font-size:clamp(8.5px,min(.7vw,1.24vh),32px); font-weight:650; letter-spacing:.07em; text-transform:uppercase;
  padding:.35em .7em; border-radius:99px; border:1px solid color-mix(in oklab,var(--accent) 42%, transparent); color:var(--accent-t); white-space:nowrap}
.tag.med{background:var(--no); border-color:var(--no); color:#fff}
.cmp .more{margin-top:auto; font-size:clamp(10px,min(.84vw,1.49vh),38px); color:var(--ink-3); display:flex; align-items:center; gap:5px}
.cmp .more::after{content:"›"; font-size:1.5em; line-height:0; position:relative; top:-.03em}

/* ---------- tautomeria ---------- */
.taut{display:grid; grid-template-columns:1fr auto 1fr; gap:clamp(8px,min(1.4vw,2.49vh),72px); align-items:center; flex:1}
.tside{border-radius:24px; padding:clamp(11px,min(1.3vw,2.31vh),60px); text-align:center; display:flex; flex-direction:column; gap:6px;
  transition:opacity .5s cubic-bezier(.32,.72,0,1), transform .5s cubic-bezier(.32,.72,0,1)}
.tside .mol{max-width:min(23.4vw,41.6vh,960px); margin:0 auto}
.tside h3{font-size:clamp(17px,min(2vw,3.56vh),87px); font-weight:640; letter-spacing:-.024em}
.tside .sub{font-size:clamp(11px,min(1vw,1.78vh),45px); color:var(--ink-3)}
.tside.dim{opacity:.34; transform:scale(.955)}
.eq{display:flex; flex-direction:column; align-items:center; gap:8px; padding:0 4px}
.eq .sym{font-size:clamp(30px,min(4.4vw,7.82vh),192px); line-height:1; color:var(--ink-2); transition:transform .5s cubic-bezier(.32,.72,0,1)}
.eq.to-keto .sym{transform:translateX(7%)}
.eq.to-enol .sym{transform:translateX(-7%)}
.eq .cap{font-size:clamp(9.5px,min(.8vw,1.42vh),36px); letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:620; text-align:center; text-wrap:balance}
.seg{display:inline-flex; padding:3px; border-radius:99px; gap:3px; align-self:center}
.seg button{padding:.5em 1.2em; border-radius:99px; font-size:clamp(11.5px,min(1vw,1.78vh),45px); font-weight:560; color:var(--ink-2);
  transition:background .3s, color .3s, box-shadow .3s}
.seg button[aria-pressed="true"]{background:var(--glass-hi); color:var(--ink); box-shadow:0 1px 3px rgba(14,20,25,.12)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{box-shadow:none}
.balance{display:flex; flex-direction:column; gap:6px; max-width:min(53vw,94.2vh,2160px); width:100%; margin:0 auto}
.balance .bar{height:12px; border-radius:99px; overflow:hidden; display:flex; border:1px solid var(--edge-soft)}
.balance .bar i{display:block; height:100%}
.balance .lg{display:flex; justify-content:space-between; font-size:clamp(10px,min(.86vw,1.53vh),39px); color:var(--ink-3)}

/* ---------- quiz ---------- */
.quiz{flex:1; display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(12px,min(2vw,3.56vh),96px); align-items:center}
.qstage{border-radius:26px; padding:clamp(14px,min(2vw,3.56vh),90px); display:flex; flex-direction:column; gap:12px; align-items:center}
.qstage .mol{max-width:min(100%,41vw,72.9vh,1680px); margin:0 auto}

2}", "med": true, "aplic": "É um medicamento betabloqueador usado no tratamento da hipertensão arterial e de arritmias cardíacas e na prevenção da enxaqueca.", "import": "Contém uma hidroxila de álcool secundário, além das funções éter e amina. Consta na Relação Nacional de Medicamentos Essenciais (Rename), sendo disponibilizado gratuitamente pelo Sistema Único de Saúde (SUS) (Brasil, 2024)", "en": "Propranolol", "letra": "j", "cit": "NCBI (2026j)", "ref": "NATIONAL CENTER FOR BIOTECHNOLOGY INFORMATION (NCBI). **Propranolol**: PubChem Compound Summary. Bethesda: NCBI, 2026j. Disponível em: https://pubchem.ncbi.nlm.nih.gov/compound/Propranolol. Acesso em: 15 set. 2026."}]}, {"key": "fen", "nome": "Fenóis", "singular": "Fenol", "cor": "E09F3E", "geral": "g_fen", "geralLegenda": "Fenol (hidroxibenzeno), o representante mais simples da função", "conceito": "Fenóis são compostos que apresentam a hidroxila (–OH) ligada diretamente a um carbono de anel aromático. O representante mais simples é o próprio fenol, também chamado hidroxibenzeno ou benzenol, de fórmula C_{6}H_{5}OH. Se a hidroxila estiver ligada a um carbono fora do anel, o composto é um álcool, e não um fenol (Solomons; Fryhle; Snyder, 2018).", "exemploTexto": "A Figura {F} mostra a estrutura do fenol, com a hidroxila ligada ao anel em destaque.", "caract": ["São mais ácidos que os álcoois (pKa do fenol em torno de 10), porque a carga negativa do íon fenóxido é estabilizada por ressonância com o anel aromático; por isso reagem com bases fortes, como o NaOH, formando fenóxidos (fenolatos).", "Também formam ligações de hidrogênio, o que eleva seus pontos de fusão e de ebulição.", "O fenol comum é um sólido cristalino, tóxico e corrosivo para a pele, historicamente utilizado como antisséptico hospitalar.", "Muitos fenóis atuam como antioxidantes, porque doam o hidrogênio da hidroxila a radicais livres, interrompendo reações em cadeia de oxidação."], "nomencl": "O nome sistemático usa o prefixo “hidróxi-” seguido do nome do hidrocarboneto aromático (hidroxibenzeno), sendo “fenol” um nome aceito pela IUPAC. Os derivados são nomeados a partir do fenol, indicando-se a posição dos substituintes por números ou pelos prefixos orto, meta e para: 2-metilfenol (orto-cresol), 4-metilfenol (para-cresol).", "compostos": [{"img": "paracetamol", "nome": "Paracetamol", "iupac": "N-(4-hidroxifenil)acetamida", "formula": "C_{8}H_{9}NO_{2}", "med": true, "aplic": "É um dos analgésicos e antitérmicos mais utilizados no mundo, indicado para dores leves a moderadas e febre.", "import": "Apresenta um grupo fenol e um grupo amida na mesma molécula. É seguro nas doses recomendadas, mas o excesso pode causar lesão grave no fígado. Consta na Rename (Brasil, 2024)", "en": "Acetaminophen", "letra": "a", "cit": "NCBI (2026a)", "ref": "NATIONAL CENTER FOR BIOTECHNOLOGY INFORMATION (NCBI). **Acetaminophen**: PubChem Compound Summary. Bethesda: NCBI, 2026a. Disponível em: https://pubchem.ncbi.nlm.nih.gov/compound/Acetaminophen. Acesso em: 15 set. 2026."}, {"img": "timol", "nome": "Timol", "iupac": "5-metil-2-(propan-2-il)fenol", "formula": "C_{10}H_{14}O", "aplic": "É usado como antisséptico em enxaguantes bucais e em outros produtos de higiene.", "import": "É obtido do óleo essencial do tomilho. Sua ação antimicrobiana ajuda a reduzir a placa bacteriana e o mau hálito", "en": "Thymol", "letra": "k", "cit": "NCBI (2026k)", "ref": "NATIONAL CENTER FOR BIOTECHNOLOGY INFORMATION (NCBI). **Thymol**: PubChem Compound Summary. Bethesda: NCBI, 2026k. Disponível em: https://pubchem.ncbi.nlm.nih.gov/compound/Thymol. Acesso em: 15 set. 2026."}, {"img": "eugenol", "nome": "Eugenol", "iupac": "2-metóxi-4-(prop-2-en-1-il)fenol", "formula": "C_{10}H_{12}O_{2}", "aplic": "É empregado na odontologia, no cimento de óxido de zinco e eugenol, e como aromatizante em alimentos e perfumes.", "import": "É o principal componente do óleo de cravo-da-índia e tem efeito analgésico e antisséptico local, útil em curativos dentários provisórios", "en": "Eugenol", "letra": "f", "cit": "NCBI (2026f)", "ref": "NATIONAL CENTER FOR BIOTECHNOLOGY INFORMATION (NCBI). **Eugenol**: PubChem Compound Summary. Bethesda: NCBI, 2026f. Disponível em: https://pubchem.ncbi.nlm.nih.gov/compound/Eugenol. Acesso em: 15 set. 2026."}, {"img": "bht", "nome": "BHT (hidroxitolueno butilado)", "iupac": "2,6-di-terc-butil-4-metilfenol", "formula": "C_{15}H_{24}O", "aplic": "É um antioxidante sintético adicionado a alimentos (INS 321), cosméticos e plásticos.", "import": "O hidrogênio da hidroxila fenólica é doado a radicais livres, interrompendo reações de oxidação e retardando a rancificação de gorduras e óleos", "en": "Butylated Hydroxytoluene", "letra": "c", "cit": "NCBI (2026c)", "ref": "NATIONAL CENTER FOR BIOTECHNOLOGY INFORMATION (NCBI). **Butylated Hydroxytoluene**: PubChem Compound Summary. Bethesda: NCBI, 2026c. Disponível em: https://pubchem.ncbi.nlm.nih.gov/compound/Butylated-Hydroxytoluene. Acesso em: 15 set. 2026."}]}, {"key": "eno", "nome": "Enóis", "singular": "Enol", "cor": "6C4AB6", "geral": "g_eno", "geralLegenda": "Etenol (álcool vinílico), o enol mais simples", "conceito": "Enóis são compostos que apresentam a hidroxila (–OH) ligada a um carbono que participa de uma ligação dupla entre carbonos (C=C–OH). O nome resulta da junção de “eno” (ligação dupla) com “ol” (hidroxila) (Solomons; Fryhle; Snyder, 2018).", "exemploTexto": "A Figura {F} mostra o enol mais simples, o etenol. Em condições comuns, porém, ele se converte em etanal, um aldeído, como mostra a Figura {F2}; por isso o etenol não é isolado.", "caract": ["A maioria dos enóis simples é instável e se converte espontaneamente em aldeído ou cetona por meio da tautomeria ceto-enólica, um equilíbrio químico em que um átomo de hidrogênio migra do oxigênio para o carbono e a ligação dupla passa de C=C para C=O.", "Nesse equilíbrio, a forma carbonílica (ceto) normalmente predomina, porque a ligação C=O é mais estável que a C=C.", "Enóis podem ser estáveis quando há conjugação com outras ligações duplas ou com carbonilas, ligação de hidrogênio intramolecular ou estrutura cíclica. É o caso de todos os exemplos apresentados a seguir.", "A hidroxila enólica costuma ser mais ácida que a dos álcoois, com pKa próximo ao dos fenóis."], "nomencl": "Pela IUPAC, combinam-se os sufixos “-en” (ligação dupla) e “-ol” (hidroxila), indicando-se as posições de cada um: etenol, prop-1-en-2-ol, but-1-en-2-ol. A cadeia é numerada de forma que a hidroxila receba o menor número possível.", "compostos": [{"img": "vitc", "nome": "Ácido ascórbico (vitamina C)", "iupac": "(5R)-5-[(1S)-1,2-di-hidroxietil]-3,4-di-hidroxifuran-2(5H)-ona", "formula": "C_{6}H_{8}O_{6}", "aplic": "É uma vitamina presente em frutas cítricas, utilizada como suplemento e como antioxidante em alimentos (INS 300).", "import": "Possui duas hidroxilas ligadas aos carbonos de uma mesma ligação dupla (enodiol), estabilizadas pela conjugação com a carbonila do anel. A acidez da vitamina C vem de uma dessas hidroxilas enólicas, e não de um grupo carboxila. Sua carência causa o escorbuto", "en": "Ascorbic Acid", "letra": "b", "cit": "NCBI (2026b)", "ref": "NATIONAL CENTER FOR BIOTECHNOLOGY INFORMATION (NCBI). **Ascorbic Acid**: PubChem Compound Summary. Bethesda: NCBI, 2026b. Disponível em: https://pubchem.ncbi.nlm.nih.gov/compound/Ascorbic-Acid. Acesso em: 15 set. 2026."}, {"img": "varfarina", "nome": "Varfarina", "iupac": "4-hidróxi-3-(3-oxo-1-fenilbutil)-2H-cromen-2-ona", "formula": "C_{19}H_{16}O_{4}", "med": true, "aplic": "É um anticoagulante oral usado na prevenção e no tratamento de tromboses e embolias.", "import": "A hidroxila enólica está ligada a um anel conjugado com a carbonila, o que a estabiliza. Atua como antagonista da vitamina K e exige controle rigoroso da dose por exames de sangue. Consta na Rename (Brasil, 2024)", "en": "Warfarin", "letra": "l", "cit": "NCBI (2026l)", "ref": "NATIONAL CENTER FOR BIOTECHNOLOGY INFORMATION (NCBI). **Warfarin**: PubChem Compound Summary. Bethesda: NCBI, 2026l. Disponível em: https://pubchem.ncbi.nlm.nih.gov/compound/Warfarin. Acesso em: 15 set. 2026."}, {"img": "curcumina", "nome": "Curcumina", "iupac": "(1E,6E)-1,7-bis(4-hidróxi-3-metoxifenil)hepta-1,6-dieno-3,5-diona", "formula": "C_{21}H_{20}O_{6}", "aplic": "É o pigmento amarelo da cúrcuma (açafrão-da-terra), utilizado como corante alimentício (INS 100).", "import": "Embora seja nomeada como dicetona, existe predominantemente na forma enólica, estabilizada pela extensa conjugação e por uma ligação de hidrogênio intramolecular. Essa conjugação também é responsável pela cor amarela intensa", "en": "Curcumin", "letra": "d", "cit": "NCBI (2026d)", "ref": "NATIONAL CENTER FOR BIOTECHNOLOGY INFORMATION (NCBI). **Curcumin**: PubChem Compound Summary. Bethesda: NCBI, 2026d. Disponível em: https://pubchem.ncbi.nlm.nih.gov/compound/Curcumin. Acesso em: 15 set. 2026."}, {"img": "maltol", "nome": "Maltol", "iupac": "3-hidróxi-2-metil-4H-piran-4-ona", "formula": "C_{6}H_{6}O_{3}", "aplic": "É um realçador de sabor e aroma (INS 636) usado em pães, doces, chocolates e bebidas.", "import": "Surge naturalmente no malte torrado e em alimentos assados, com aroma de caramelo. Sua hidroxila enólica é estabilizada pelo anel conjugado com a carbonila", "en": "Maltol", "letra": "h", "cit": "NCBI (2026h)", "ref": "NATIONAL CENTER FOR BIOTECHNOLOGY INFORMATION (NCBI). **Maltol**: PubChem Compound Summary. Bethesda: NCBI, 2026h. Disponível em: https://pubchem.ncbi.nlm.nih.gov/compound/Maltol. Acesso em: 15 set. 2026."}]}], "refsFixas": ["BRASIL. Ministério da Saúde. Secretaria de Ciência, Tecnologia, Inovação e Insumos Estratégicos em Saúde. **Relação Nacional de Medicamentos Essenciais**: Rename 2024. Brasília, DF: Ministério da Saúde, 2024. Disponível em: https://www.gov.br/saude/pt-br/composicao/sectics/rename/rename-2024. Acesso em: 15 set. 2026.", "SOLOMONS, T. W. Graham; FRYHLE, Craig B.; SNYDER, Scott A. **Química orgânica**. 12. ed. Rio de Janeiro: LTC, 2018. v. 1."]};

const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c) n.className=c; if(h!=null) n.innerHTML=h; return n;};
const esc = s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
/* formatação inline do content.js: _{x} subscrito, ^{x} sobrescrito, **x** negrito */
const fmt = s=>esc(s)
  .replace(/_\{([^}]*)\}/g,'<sub>$1</sub>')
  .replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>')
  .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
const mol = name=>{const d=el('div','mol'); d.innerHTML = MOL[name]||''; d.setAttribute('role','img'); return d;};
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* régua de acidez — dot plot na escala real de pKa */
const PKA_LO = 3, PKA_HI = 17.5;
const PKA = [
  {v:4.8,  t:'4,8',   l:'Ácido acético', s:'referência ácida',            c:'var(--no)',    st:0},
  {v:10,   t:'≈10', l:'Fenol',             s:'reage com NaOH e forma fenóxido', c:'var(--fen-t)', st:1},
  {v:10.5, t:'≈10', l:'Enol',              s:'próximo ao fenol',                c:'var(--eno-t)', st:1},
  {v:15.7, t:'15,7',  l:'Água',            s:'referência neutra',               c:'var(--ink-3)', st:0},
  {v:16,   t:'≈16', l:'Álcool',       s:'não é neutralizado por NaOH', c:'var(--alc-t)', st:1}
];
function sAcidez(){
  const w = el('div','wrap');
  w.appendChild(hdr('A mesma hidroxila, três acidezes'));
  const box = el('div','ruler glass');
  box.appendChild(el('p','kicker','Escala de pKa — quanto menor o valor, mais ácida é a hidroxila'));

  const dots = el('div','dots');
  const pos = v=>((v-PKA_LO)/(PKA_HI-PKA_LO)*100).toFixed(2)+'%';
  PKA.forEach(p=>{
    const cell = c=>{ const n=el('span',c); n.style.setProperty('--c',p.c); return stepper(n,p.st); };
    const nm = cell('dn'); nm.textContent = p.l;
    const tr = cell('dt'); const dot = el('i'); dot.style.setProperty('--x',pos(p.v)); tr.appendChild(dot);
    const vl = cell('dv'); vl.textContent = p.t;
    const ds = cell('ds'); ds.textContent = p.s;
    dots.append(nm,tr,vl,ds);
  });
  const axis = el('span','axis');
  [4,8,12,16].forEach(v=>{ const s=el('span',null,String(v)); s.style.left=pos(v); axis.appendChild(s); });
  dots.append(el('span'), axis, el('span'), el('span'));
  box.appendChild(dots);

  box.appendChild(stepper(el('p','note','O anel aromático estabiliza o íon fenóxido por ressonância — por isso o fenol perde o H muito mais facilmente que um álcool. Valores aproximados (Solomons; Fryhle; Snyder, 2018).'),2));
  w.appendChild(box);
  return {node:w, steps:2};
}

/* linha curta que expande o texto completo */
function xrow(label, full){
  const r = el('div','xrow');
  const b = el('button',null,'<span>'+label+'</span><span class="pl">+</span>');
  b.type = 'button';
  b.setAttribute('aria-expanded','false');
  const box = el('div','full','<div><p>'+full+'</p></div>');
  b.addEventListener('click',()=>{
    const open = r.classList.toggle('open');
    b.setAttribute('aria-expanded', String(open));
    /* só uma linha aberta por vez: o slide não muda de altura */
    if(open) [...r.parentElement.children].forEach(o=>{
      if(o!==r && o.classList.contains('open')){
        o.classList.remove('open');
        o.querySelector('button').setAttribute('aria-expanded','false');
      }
    });
  });
  r.append(b,box);
  return r;
}

  function side(which){
    left.classList.toggle('dim', which==='keto');

/* quiz */
function sQuiz(){
  const w = el('div','wrap');
  const h = hdr('Álcool, fenol ou enol?');
  h.appendChild(el('span','eyebrow','o –OH já está destacado'));
  w.appendChild(h);

  const g = el('div','quiz');
  const stage = el('div','qstage glass neutral');
  const side = el('div','qside');
  const opts = el('div','qopts');
  const fb = el('div','qfb glass');
  const meta = el('div','qmeta');
  const again = el('button','btn glass','Jogar de novo');
  again.type='button';
  side.append(opts,fb,meta,again);
  g.append(stage,side);
  w.appendChild(g);

  let order=[], idx=0, hits=0, done=0, locked=false;
  const keys = Object.keys(byImg);

  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

  function paintMeta(){
    meta.innerHTML = '<span class="sc"><strong>'+hits+'</strong>de '+done+' certas</span>'
      + '<span>composto '+Math.min(idx+1,keys.length)+' de '+keys.length+'</span>';
  }
  function ask(){
    locked=false; again.hidden = true;
    stage.classList.add('neutral');
    const c = byImg[order[idx]];
    stage.innerHTML='';
    stage.appendChild(mol(c.img));
    const cap = el('p','sub'); cap.style.cssText='color:var(--ink-3);font-size:clamp(11px,min(.95vw,1.69vh),42px)';
    cap.textContent = 'Composto '+(idx+1)+' de '+keys.length;
    stage.appendChild(cap);
    opts.innerHTML='';
    DATA.funcs.forEach(f=>{
      const b = el('button','glass'); b.type='button';
      b.style.setProperty('--c','var(--'+f.key+')');
      b.innerHTML = '<span class="dt"></span>'+esc(f.singular);
      b.addEventListener('click',()=>answer(f.key,b));
      opts.appendChild(b);
    });
    fb.innerHTML = '<span style="color:var(--ink-3)">Em que tipo de carbono está a hidroxila destacada?</span>';
    paintMeta();
  }
  function answer(key,btn){
    if(locked) return;
    locked=true; done++;
    const c = byImg[order[idx]];
    const ok = key===c.fk;
    if(ok) hits++;
    stage.classList.remove('neutral');
    [...opts.children].forEach(b=>b.disabled=true);
    btn.classList.add(ok?'right':'wrong');
    if(!ok){
      const right = [...opts.children][DATA.funcs.findIndex(f=>f.key===c.fk)];
      if(right) right.classList.add('right');
    }
    fb.innerHTML = '<b>'+esc(c.nome)+'</b> — '+(ok?'isso.':'na verdade é '+esc(F[c.fk].singular).toLowerCase()+'. ')
      + CARBON[c.fk].charAt(0).toLowerCase()+CARBON[c.fk].slice(1)+'.';
    paintMeta();
    setTimeout(()=>{
      idx++;
      if(idx<order.length){ ask(); }
      else{
        stage.innerHTML='';
        const big = el('div'); big.style.cssText='text-align:center;padding:2em 0';
        big.innerHTML = '<div style="font-family:var(--f-mono);font-size:clamp(40px,min(7vw,12.45vh),258px);font-weight:600;letter-spacing:-.04em">'
          + hits + '<span style="color:var(--ink-3)">/'+keys.length+'</span></div>';
        stage.appendChild(big);
        opts.innerHTML='';
        fb.innerHTML = hits===keys.length ? '<b>Todas.</b> A turma entendeu onde o –OH mora.'
          : 'Reveja as que escaparam — a pista está sempre no carbono ligado à hidroxila.';
        again.hidden = false;
      }
    }, ok?1100:2400);
  }
  function start(){ order = shuffle(keys.slice()); idx=0; hits=0; done=0; ask(); }
  again.addEventListener('click',start);
  start();
  return {node:w, steps:0};
}

/* conclusão */
const CONCL = [
  ['alc','Álcool','Ligação de hidrogênio e acidez fraca. Do combustível ao betabloqueador.'],
  ['fen','Fenol','O anel deixa o –OH ácido e antioxidante. Analgésico, antisséptico, conservante.'],
  ['eno','Enol','Só sobrevive conjugado. Vitamina C, anticoagulante, corante.']
];
function sConcl(){
  const w = el('div','wrap');
  w.appendChild(hdr('O que fica'));
  const c = el('div','concl');
  CONCL.forEach(([k,t,d],i)=>{
    const r = el('div','crow glass');
    r.style.setProperty('--accent','var(--'+k+')');
    r.appendChild(el('div','oh','OH'));
    const tx = el('div');
    tx.appendChild(el('h3',null,esc(t)));
    tx.appendChild(el('p',null,esc(d)));
    r.appendChild(tx);
    c.appendChild(stepper(r,i));
  });

}

/* referências */
function sRefs(){
  const w = el('div','wrap');
  w.appendChild(hdr('Referências'));
  const list = DATA.refsFixas.concat(
    DATA.funcs.flatMap(f=>f.compostos.map(c=>c.ref))
  ).sort((a,b)=>a.localeCompare(b,'pt-BR'));

  });

}

/* ------------------------------------------------------------------ deck */
const SPEC = [
  {sec:'abertura', label:'Abertura', make:sCapa,                      title:'Capa'},
  {sec:'abertura', label:'Abertura', make:sTese,                      title:'Um –OH, três funções'},
  {sec:'abertura', label:'Abertura', make:sAcidez,                    title:'Régua de acidez'},
  {sec:'alc',      label:'Álcool', make:()=>sConceito(F.alc),    title:'Álcoois: conceito'},
  {sec:'alc',      label:'Álcool', make:()=>sCompostos(F.alc),   title:'Álcoois no cotidiano'},
  {sec:'fen',      label:'Fenol',   make:()=>sConceito(F.fen),        title:'Fenóis: conceito'},
  {sec:'fen',      label:'Fenol',   make:()=>sCompostos(F.fen),       title:'Fenóis no cotidiano'},
  {sec:'eno',      label:'Enol',    make:()=>sConceito(F.eno),        title:'Enóis: conceito'},
  {sec:'eno',      label:'Enol',    make:sTaut,                       title:'Tautomeria ceto-enólica'},
  {sec:'eno',      label:'Enol',    make:()=>sCompostos(F.eno),       title:'Enóis no cotidiano'},
  {sec:'fecho',    label:'Fecho',   make:sQuiz,                       title:'Quiz com a turma'},
  {sec:'fecho',    label:'Fecho',   make:sConcl,                      title:'Conclusão'},
  {sec:'fecho',    label:'Fecho',   make:sRefs,                       title:'Referências'}
];
const SEC_C = {abertura:'#5A6472', alc:'var(--alc)', fen:'var(--fen)', eno:'var(--eno)', fecho:'#5A6472'};
const SEC_A = {abertura:['#5A6472','#3D4652'], alc:['var(--alc)','var(--alc-t)'], fen:['var(--fen)','var(--fen-t)'], eno:['var(--eno)','var(--eno-t)'], fecho:['#5A6472','#3D4652']};

/* falas: [nº, slides (0-based), descrição] */
const FALAS = [
  [1,[0,1],'Abertura e a ideia central do –OH'],
  [2,[2,3],'Régua de acidez e conceito de álcool'],
  [3,[4],'Os quatro álcoois do cotidiano'],
  [4,[5,6],'Fenóis: conceito e cotidiano'],
  [5,[7,8],'Enóis e a tautomeria ceto-enólica'],
  [6,[9,11],'Os quatro enóis e a conclusão']
];

const stage = $('#stage');
const slides = SPEC.map((s,i)=>{
  const built = s.make();
  const sec = el('section','slide');
  sec.id = 'slide-'+i;
  sec.setAttribute('aria-label', (i+1)+'. '+s.title);
  sec.appendChild(built.node);
  stage.appendChild(sec);
  return {...s, ...built, node:sec};
});

/* barra de capítulos */
const chap = $('#chap');
slides.forEach((s,i)=>{
  if(i>0 && s.sec!==slides[i-1].sec) chap.appendChild(el('span','sep'));
  const t = el('button','tick');
  t.type='button';
  t.style.setProperty('--tc', SEC_C[s.sec]);
  t.title = (i+1)+'. '+s.title;
  t.setAttribute('aria-label', 'Ir para '+(i+1)+'. '+s.title);
  t.addEventListener('click',()=>go(i,true));
  chap.appendChild(t);
});
const ticks = [...chap.querySelectorAll('.tick')];

/* estado */
let cur = -1, step = 0;
function speakerOf(i){
  const f = FALAS.find(x=>x[1].includes(i));
  if(f) return f;
  if(slides[i].title.startsWith('Quiz')) return null;
  return undefined;
}
function names(){ return store.get('grupo1.nomes', ['','','','','','']); }

function paintSteps(){
  const s = slides[cur];
  s.node.querySelectorAll('.step').forEach(n=>{
    n.classList.toggle('shown', Number(n.dataset.step) <= step);
  });
}
function paintBar(){
  ticks.forEach((t,i)=>{
    t.classList.toggle('cur', i===cur);
    t.classList.toggle('done', i<cur);
  });
  const who = $('#who');
  const f = speakerOf(cur);
  if(f===null){ who.innerHTML = '<span class="av">T</span>Turma toda'; }
  else if(f===undefined){ who.innerHTML = ''; }
  else{
    const nm = (names()[f[0]-1]||'').trim();
    who.innerHTML = '<span class="av">'+f[0]+'</span>'+esc(nm||('Integrante '+f[0]));
  }
}
function go(i, full){
  i = Math.max(0, Math.min(slides.length-1, i));
  if(i===cur){ if(full) { step = slides[i].steps; paintSteps(); } return; }
  const dir = cur===-1 ? 0 : (i>cur ? 1 : -1);
  if(cur>=0){
    const old = slides[cur].node;
    old.style.setProperty('--dx', (dir>0?'-2.5%':'2.5%'));
    old.classList.remove('on');
  }
  cur = i; step = full ? slides[i].steps : 0;
  const n = slides[i].node;
  n.style.setProperty('--dx', (dir>0?'2.5%':'-2.5%'));
  n.offsetHeight; /* reflow para a transição pegar a posição inicial */
  n.classList.add('on');
  n.scrollTop = 0;
  const a = SEC_A[slides[i].sec];
  document.documentElement.style.setProperty('--accent', a[0]);
  document.documentElement.style.setProperty('--accent-t', a[1]);
  paintSteps(); paintBar();
  location.hash = 's'+(i+1);
}
function next(){ if(step < slides[cur].steps){ step++; paintSteps(); } else go(cur+1); }
function prev(){ if(step > 0){ step--; paintSteps(); } else if(cur>0) go(cur-1, true); }

/* ----------------------------------------------------------- folha/modal */
let openSheet = null, lastFocus = null;
function showSheet(node){
  if(openSheet) hideSheet();
  lastFocus = document.activeElement;
  openSheet = node;
  node.hidden = false;
  node.offsetHeight;
  node.classList.add('on');
  $('#scrim').classList.add('on');
  const f = node.querySelector('[data-close]');
  if(f) f.focus();
}
function hideSheet(){
  if(!openSheet) return;
  const n = openSheet; openSheet = null;
  n.classList.remove('on');
  $('#scrim').classList.remove('on');
  setTimeout(()=>{ if(!n.classList.contains('on')) n.hidden = true; }, 420);
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
$('#scrim').addEventListener('click', hideSheet);
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', hideSheet));

function openDetail(img){
  const c = byImg[img], f = F[c.fk];
  const b = $('#dBody');
  b.innerHTML = '';
  b.parentElement.style.setProperty('--accent','var(--'+c.fk+')');
  b.parentElement.style.setProperty('--accent-t','var(--'+c.fk+'-t)');

  const fig = el('div','fig plate');
  fig.appendChild(mol(c.img));
  b.appendChild(fig);

  const kv = el('div','kv');
  const top = el('div');
  top.appendChild(el('p','kicker',esc(f.singular)));
  const hh = el('h3',null,esc(c.nome)); hh.id='dTitle';
  top.appendChild(hh);
  kv.appendChild(top);

  const facts = el('div','facts');
  facts.appendChild(el('span','fact',fmt(c.formula)));
  facts.appendChild(el('span','tag'+(c.med?' med':''),esc(TAG[c.img]||'')));
  kv.appendChild(facts);
  kv.appendChild(el('p','iupac',esc(c.iupac)));

  const a = el('section');
  a.appendChild(el('p','kicker','Aplicação'));
  a.appendChild(el('p',null,fmt(c.aplic)));
  kv.appendChild(a);

  const im = el('section');
  im.appendChild(el('p','kicker','Por que importa'));
  im.appendChild(el('p',null,fmt(c.import)+'.'));
  kv.appendChild(im);

  kv.appendChild(el('p','src','<b>Fonte:</b> '+fmt(c.ref).replace(/(https?:\/\/\S+)/g,'<span class="u">$1</span>')));
  b.appendChild(kv);
  showSheet($('#detail'));
}

/* roteiro */
const falasBox = $('#falas');
function paintRoteiro(){
  const nm = names();
  falasBox.innerHTML = '';
  FALAS.forEach(([n, sl, desc])=>{
    const r = el('div','fala');
    if(sl.includes(cur)) r.classList.add('cur');
    r.style.setProperty('--accent', SEC_C[slides[sl[0]].sec]);
    r.appendChild(el('div','n',String(n)));
    const tx = el('div');
    const nme = el('div','nm');
    nme.contentEditable = 'true';
    nme.spellcheck = false;
    nme.dataset.ph = 'Integrante '+n;
    nme.textContent = nm[n-1]||'';
    nme.addEventListener('input',()=>{
      const cp = names(); cp[n-1] = nme.textContent.trim().slice(0,40);
      store.set('grupo1.nomes', cp); paintBar();
    });
    nme.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Enter'){ e.preventDefault(); nme.blur(); } });
    tx.appendChild(nme);
    tx.appendChild(el('div','wh',esc(desc)));
    r.appendChild(tx);
    const go2 = el('button','go', sl.map(i=>i+1).join(sl.length>1?'–':''));
    go2.type='button';
    go2.addEventListener('click',()=>{ hideSheet(); go(sl[0]); });
    r.appendChild(go2);
    falasBox.appendChild(r);
  });
  const q = el('div','fala');
  if(cur===10) q.classList.add('cur');
  q.appendChild(el('div','n','✦'));
  const qt = el('div');
  qt.appendChild(el('div','nm','Turma toda'));
  qt.appendChild(el('div','wh','Quiz Álcool, fenol ou enol?'));
  q.appendChild(qt);
  const qg = el('button','go','11'); qg.type='button';
  qg.addEventListener('click',()=>{ hideSheet(); go(10); });
  q.appendChild(qg);
  falasBox.appendChild(q);
}
$('#tRoteiro').addEventListener('click',()=>{ paintRoteiro(); showSheet($('#roteiro')); });

/* cronômetro */
let t0 = null, tTick = null;
function paintClock(){
  const c = $('#clock');
  const ms = t0 ? Date.now()-t0 : 0;
  const s = Math.floor(ms/1000);
  c.textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  c.classList.toggle('run', !!t0);
}
$('#tClock').addEventListener('click',()=>{
  if(t0){ t0=null; clearInterval(tTick); tTick=null; }
  else{ t0=Date.now(); tTick=setInterval(paintClock,500); }
  paintClock();
});

/* ------------------------------------------------------------- navegação */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='Escape'){ hideSheet(); return; }
  if(openSheet) return;
  const k = e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){ e.preventDefault(); prev(); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(slides.length-1, true); }
  else if(k==='r'||k==='R'){ paintRoteiro(); showSheet($('#roteiro')); }
  else if(k==='t'||k==='T'){ $('#tClock').click(); }
  else if(k==='f'||k==='F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(()=>{});
  }
});
document.querySelectorAll('#zones button').forEach(b=>{
  b.addEventListener('click',()=>{ if(!openSheet) (b.dataset.nav==='1'?next():prev()); });
});
/* roda / trackpad avança o slide: sem isso, rolar não fazia nada */
let wAcc = 0, wLast = 0, wLock = 0;
stage.addEventListener('wheel',e=>{
  if(openSheet) return;
  const n = slides[cur].node;
  if(n.scrollHeight > n.clientHeight + 4) return;   /* deixa rolar de verdade */
  e.preventDefault();
  const now = Date.now();
  if(now - wLast > 220) wAcc = 0;                   /* gesto novo */
  wLast = now;
  wAcc += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if(now < wLock || Math.abs(wAcc) < 48) return;
  wLock = now + 620;                                /* segura a inércia do trackpad */
  (wAcc > 0 ? next : prev)();
  wAcc = 0;
},{passive:false});

let sx=null, sy=null;
stage.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
stage.addEventListener('touchend',e=>{
  if(sx==null||openSheet) return;
  const dx = e.changedTouches[0].clientX-sx, dy = e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>56 && Math.abs(dx)>Math.abs(dy)*1.6) (dx<0?next():prev());
  sx=sy=null;
},{passive:true});

/* estado atravessa republicações */
if(window.claude?.hot){
  window.claude.hot.snapshot(()=>({i:cur, st:step}));
}
function boot(d){
  const m = /^#s(\d+)$/.exec(location.hash);
  const start = d && typeof d.i==='number' ? d.i : (m ? Number(m[1])-1 : 0);
  go(start);
  if(d && typeof d.st==='number'){ step = Math.min(d.st, slides[cur].steps); paintSteps(); }
  paintClock();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
